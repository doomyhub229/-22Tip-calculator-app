<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&amp;display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Tip calculator app</title>


</head>

<body>

  <header>
    <img src="./images/logo.svg" alt="splitter">
  </header>

  <main class="tip-calculator">
    <section class="fill-form">
      <form class="calculator__controls">
        <div class="form-group">
          <label for="bill">Bill</label>
          <div class="input-wrap">
            <img src="./images/icon-dollar.svg" alt="" aria-hidden="true">
            <input id="bill" name="bill" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0">
          </div>
        </div>

        <fieldset class="tip-options">
          <legend>Select Tip %</legend>

          <div class="tip-options__grid">
            <button type="button" data-tip="5">5%</button>
            <button type="button" data-tip="10">10%</button>
            <button type="button" data-tip="15">15%</button>
            <button type="button" data-tip="25">25%</button>
            <button type="button" data-tip="50">50%</button>

            <label class="custom-tip" for="custom-tip">
              <span class="sr-only">Custom tip percentage</span>

              <input id="custom-tip" name="custom-tip" type="number" min="0" inputmode="decimal" placeholder="Custom">
            </label>
          </div>
        </fieldset>

        <div class="form-group group-people">

          <div class="label-row">
            <label for="people">Number of People</label>

            <span class="error-message">
              Can't be zero
            </span>
          </div>

          <div class="input-wrap">
            <img src="./images/icon-person.svg" alt="" aria-hidden="true">

            <input id="people" name="people" type="number" min="1" step="1" inputmode="numeric" placeholder="0">
          </div>

        </div>
      </form>
    </section>

    <section class="result-form" aria-label="Calculation results">
      <div class="result-row">
        <p>Tip Amount <span>/ person</span></p>
        <output id="tip-amount" aria-live="polite">$0.00</output>
      </div>

      <div class="result-row">
        <p>Total <span>/ person</span></p>
        <output id="total" aria-live="polite">$0.00</output>
      </div>

      <button class="reset-button" type="button" disabled>Reset</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
